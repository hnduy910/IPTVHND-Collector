name: Update IPTV collection

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */12 * * *"
  # Data commits made by the collector do not touch these paths, preventing
  # a bot-commit → workflow → bot-commit loop. Source/config changes can still
  # be run with workflow_dispatch.
  push:
    branches: [main]
    paths:
      - "collector/**"
      - "config/channel_reference.json"
      - "tests/**"
      - ".github/workflows/collect.yml"
      - "README.md"
      - "VERSION"

permissions:
  contents: write

concurrency:
  group: iptvhnd-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest

      - name: Run tests
        run: python -m pytest -q

      - name: Check Python syntax
        run: python -m py_compile collector/*.py

      - name: Discover and validate public community IPTV sources
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python collector/discover_sources.py
          --sources config/sources.txt
          --state config/source_state.json
          --timeout 20
          --max-results-per-query 30
          --queries-per-run 8

      - name: Collect Archive and build three health-checked Live playlists
        run: >-
          python collector/main.py
          --sources config/sources.txt
          --source-state config/source_state.json
          --output iptvhnd.m3u
          --vietnam-live-output iptvhnd-vietnam-live.m3u
          --football-live-output iptvhnd-football-live.m3u
          --movies-live-output iptvhnd-movies-live.m3u
          --legacy-live-output iptvhnd-live.m3u
          --stats stats.json
          --health-timeout 8
          --health-workers 32

      - name: Validate Archive-to-Live outputs and statistics
        run: >-
          python collector/validate_outputs.py
          --archive iptvhnd.m3u
          --vietnam iptvhnd-vietnam-live.m3u
          --football iptvhnd-football-live.m3u
          --movies iptvhnd-movies-live.m3u
          --stats stats.json

      - name: Commit updates
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/sources.txt config/source_state.json iptvhnd.m3u iptvhnd-live.m3u iptvhnd-vietnam-live.m3u iptvhnd-football-live.m3u iptvhnd-movies-live.m3u stats.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes."
            exit 0
          fi
          git commit -m "chore: discover sources and update IPTV collection [skip ci]"
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Unable to rebase generated data cleanly." >&2
              exit 1
            fi
            if git push origin HEAD:main; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Push attempt ${attempt} lost a race; retrying." >&2
            sleep $((attempt * 5))
          done
          exit 1

      - name: Publish rolling public release
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git tag -f latest HEAD
          git push origin refs/tags/latest --force
          NOTE="Tự động cập nhật mỗi 12 giờ. Collector chỉ dùng nguồn IPTV cộng đồng công khai, loại radio/audio-only, phân loại Vietnam/Football/Movies, giữ Archive tích lũy và tạo ba Live playlist từ Archive sau health-check. Football/Movies yêu cầu video từ Full HD trở lên; Vietnam không lọc resolution. Không bypass DRM, token, paywall hoặc access control riêng tư."
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest iptvhnd.m3u iptvhnd-vietnam-live.m3u iptvhnd-football-live.m3u iptvhnd-movies-live.m3u stats.json --clobber
            gh release edit latest --title "IPTVHND Latest Collection" --notes "$NOTE"
          else
            gh release create latest iptvhnd.m3u iptvhnd-vietnam-live.m3u iptvhnd-football-live.m3u iptvhnd-movies-live.m3u stats.json --title "IPTVHND Latest Collection" --notes "$NOTE" --latest
          fi
